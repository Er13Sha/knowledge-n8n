services:
  app:
    build:
      context: ./apps/web
      target: app
    image: knowledge-system-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      document-processor:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      APP_NAME: ${DOCKER_APP_NAME:-Knowledge System}
      APP_ENV: ${DOCKER_APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_URL: ${DOCKER_APP_URL:-http://localhost}
      LOG_CHANNEL: ${DOCKER_LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${DOCKER_LOG_LEVEL:-warning}
      SERVER_NAME: ${SERVER_NAME:-:8080}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-auto_https off}
      FRANKENPHP_CONFIG: ${FRANKENPHP_CONFIG:-max_threads auto}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-knowledge_system}
      DB_USERNAME: ${DB_USERNAME:-knowledge_system}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_SSLMODE: disable
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: rabbitmq
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-960}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-knowledge_system}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-knowledge-system-rabbitmq-secret}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-knowledge-documents}
      RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT:-1200}
      RABBITMQ_CONNECTION_TIMEOUT: ${RABBITMQ_CONNECTION_TIMEOUT:-5}
      RABBITMQ_READ_TIMEOUT: ${RABBITMQ_READ_TIMEOUT:-65}
      RABBITMQ_WRITE_TIMEOUT: ${RABBITMQ_WRITE_TIMEOUT:-10}
      RABBITMQ_CHANNEL_RPC_TIMEOUT: ${RABBITMQ_CHANNEL_RPC_TIMEOUT:-10}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      N8N_INDEX_WEBHOOK_URL: ${DOCKER_N8N_INDEX_WEBHOOK_URL:-http://n8n:5678/webhook/knowledge-index}
      N8N_SEARCH_WEBHOOK_URL: ${DOCKER_N8N_SEARCH_WEBHOOK_URL:-http://n8n:5678/webhook/knowledge-search}
      N8N_DELETE_WEBHOOK_URL: ${DOCKER_N8N_DELETE_WEBHOOK_URL:-http://n8n:5678/webhook/knowledge-delete}
      N8N_TIMEOUT: ${N8N_TIMEOUT:-600}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-change-me-rag-token}
      DOCUMENT_PROCESSOR_URL: ${DOCKER_DOCUMENT_PROCESSOR_URL:-http://document-processor:8000}
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:-change-me-document-processor-token}
      DOCUMENT_PROCESSOR_TIMEOUT: ${DOCUMENT_PROCESSOR_TIMEOUT:-600}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-knowledge-system-qdrant-key}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_documents}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1400}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-16}
      RAG_OCR_LANGUAGES: ${RAG_OCR_LANGUAGES:-rus+eng}
      RAG_OCR_DPI: ${RAG_OCR_DPI:-200}
      RAG_OCR_PAGE_TIMEOUT: ${RAG_OCR_PAGE_TIMEOUT:-120}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_LEXICAL_RESULT_LIMIT: ${RAG_LEXICAL_RESULT_LIMIT:-50}
      RAG_LEXICAL_CANDIDATE_LIMIT: ${RAG_LEXICAL_CANDIDATE_LIMIT:-1000}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.25}
      RAG_CONFIDENCE_HIGH_SCORE: ${RAG_CONFIDENCE_HIGH_SCORE:-0.75}
      RAG_INTERACTION_RETENTION_DAYS: ${RAG_INTERACTION_RETENTION_DAYS:-90}
      RAG_REQUEST_TIMEOUT: ${RAG_REQUEST_TIMEOUT:-600}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      OPTIMIZE_LARAVEL: ${OPTIMIZE_LARAVEL:-true}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - app-storage:/app/storage
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  queue:
    build:
      context: ./apps/web
      target: app
    image: knowledge-system-app:latest
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      document-processor:
        condition: service_healthy
    command:
      - php
      - artisan
      - queue:work
      - rabbitmq
      - --queue=${RABBITMQ_QUEUE:-knowledge-documents}
      - --sleep=1
      - --tries=3
      - --timeout=900
      - --memory=512
    environment:
      APP_NAME: ${DOCKER_APP_NAME:-Knowledge System}
      APP_ENV: ${DOCKER_APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_URL: ${DOCKER_APP_URL:-http://localhost}
      LOG_CHANNEL: ${DOCKER_LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${DOCKER_LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-knowledge_system}
      DB_USERNAME: ${DB_USERNAME:-knowledge_system}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_SSLMODE: disable
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: rabbitmq
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-960}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-knowledge_system}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-knowledge-system-rabbitmq-secret}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-knowledge-documents}
      RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT:-1200}
      RABBITMQ_CONNECTION_TIMEOUT: ${RABBITMQ_CONNECTION_TIMEOUT:-5}
      RABBITMQ_READ_TIMEOUT: ${RABBITMQ_READ_TIMEOUT:-65}
      RABBITMQ_WRITE_TIMEOUT: ${RABBITMQ_WRITE_TIMEOUT:-10}
      RABBITMQ_CHANNEL_RPC_TIMEOUT: ${RABBITMQ_CHANNEL_RPC_TIMEOUT:-10}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-knowledge-system-qdrant-key}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_documents}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1400}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-16}
      RAG_OCR_LANGUAGES: ${RAG_OCR_LANGUAGES:-rus+eng}
      RAG_OCR_DPI: ${RAG_OCR_DPI:-200}
      RAG_OCR_PAGE_TIMEOUT: ${RAG_OCR_PAGE_TIMEOUT:-120}
      RAG_LEXICAL_CANDIDATE_LIMIT: ${RAG_LEXICAL_CANDIDATE_LIMIT:-1000}
      RAG_CONFIDENCE_HIGH_SCORE: ${RAG_CONFIDENCE_HIGH_SCORE:-0.75}
      RAG_INTERACTION_RETENTION_DAYS: ${RAG_INTERACTION_RETENTION_DAYS:-90}
      RAG_REQUEST_TIMEOUT: ${RAG_REQUEST_TIMEOUT:-600}
      N8N_INDEX_WEBHOOK_URL: ${DOCKER_N8N_INDEX_WEBHOOK_URL:-http://n8n:5678/webhook/knowledge-index}
      N8N_SEARCH_WEBHOOK_URL: ${DOCKER_N8N_SEARCH_WEBHOOK_URL:-http://n8n:5678/webhook/knowledge-search}
      N8N_DELETE_WEBHOOK_URL: ${DOCKER_N8N_DELETE_WEBHOOK_URL:-http://n8n:5678/webhook/knowledge-delete}
      N8N_TIMEOUT: ${N8N_TIMEOUT:-600}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-change-me-rag-token}
      DOCUMENT_PROCESSOR_URL: ${DOCKER_DOCUMENT_PROCESSOR_URL:-http://document-processor:8000}
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:-change-me-document-processor-token}
      DOCUMENT_PROCESSOR_TIMEOUT: ${DOCUMENT_PROCESSOR_TIMEOUT:-600}
      WAIT_FOR_DB: "true"
      OPTIMIZE_LARAVEL: "false"
    volumes:
      - app-storage:/app/storage
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-knowledge_system}
      POSTGRES_USER: ${DB_USERNAME:-knowledge_system}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:-1000}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    shm_size: ${POSTGRES_SHM_SIZE:-1g}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.2.9-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-knowledge_system}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-knowledge-system-rabbitmq-secret}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit heartbeat ${RABBITMQ_HEARTBEAT:-1200}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  document-processor:
    build:
      context: ./services/document-processor
    image: knowledge-system-document-processor:latest
    restart: unless-stopped
    environment:
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:-change-me-document-processor-token}
      DOCUMENT_PROCESSOR_MAX_FILE_MB: ${DOCUMENT_PROCESSOR_MAX_FILE_MB:-100}
      EXTRACTION_MAX_FILE_MB: ${EXTRACTION_MAX_FILE_MB:-20}
      EXTRACTION_MAX_PAGES: ${EXTRACTION_MAX_PAGES:-2000}
      DOCUMENT_PROCESSOR_MAX_PAGES: ${DOCUMENT_PROCESSOR_MAX_PAGES:-2000}
      DOCUMENT_PROCESSOR_OCR_MIN_TEXT_CHARS: ${DOCUMENT_PROCESSOR_OCR_MIN_TEXT_CHARS:-40}
    ports:
      - "${DOCUMENT_PROCESSOR_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "/opt/knowledge/ollama-entrypoint.sh"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./infrastructure/ollama/entrypoint.sh:/opt/knowledge/ollama-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama show \"$${OLLAMA_MODEL}\" >/dev/null 2>&1 && OLLAMA_HOST=127.0.0.1:11434 ollama show \"$${OLLAMA_EMBED_MODEL}\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  n8n:
    build:
      context: ./automation/n8n
      args:
        N8N_IMAGE: ${N8N_IMAGE:-n8nio/n8n:2.33.4}
    image: knowledge-system-n8n:2.33.4
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-a-long-random-string}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: 600
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-knowledge-system-qdrant-key}
    volumes:
      - qdrant-data:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  app-storage:
  caddy-config:
  caddy-data:
  n8n-data:
  ollama-data:
  postgres-data:
  qdrant-data:
  rabbitmq-data:
